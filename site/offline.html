<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline — Sayanox Problem Solve Daily</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(900px 520px at 20% 0%, #1a1233, #05070f 70%);
        color: #e8eefc;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      h1 { margin: 0 0 0.6rem; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.02em; }
      p { margin: 0 auto 1.4rem; max-width: 34rem; color: #93a3bd; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #a5f3fc; }
      button {
        padding: 0.7rem 1.2rem;
        border: 1px solid rgba(139, 92, 246, 0.6);
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.18);
        color: inherit;
        font: 600 0.95rem/1 inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        The catalogue is cached, so the last page you visited still works. This
        address was not visited yet — reconnect and reload, and it will be there.
      </p>
      <p><code>python scripts/run_tests.py</code> works with no network at all.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
